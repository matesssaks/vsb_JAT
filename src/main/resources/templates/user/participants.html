<!DOCTYPE html>
<html
	lang="en"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:th="http://www.thymeleaf.org"
	layout:decorate="~{user/_user}"
	th:with="page='participant'"
>
<title layout:fragment="title" th:text="#{participants.title}"></title>
<main layout:fragment="content">
	<a class="w-75 btn icon-link bg-white text-success text-center p-4 rounded-3 d-flex justify-content-center shadow-sm"
	   th:href="@{/camp}">
		<i class="bi bi-plus-lg fs-2"></i>
	</a>
	<div th:each="participant : ${participants}" th:object="${participant}" class="w-75 bg-white p-4 rounded-3 fs-5 d-flex justify-content-between align-items-center shadow-sm">
		<span class="col col-6 fw-semibold">
			<span th:text="${participant.person.name}"></span>
		</span>
		<a class="col col-6 btn btn-outline-primary" th:href="@{/camp/{id}(id=*{camp.id})}">
			<span th:text="${participant.camp.name}"></span> | <span th:text="${#temporals.format(participant.camp.startDate.toLocalDate(), 'SHORT', #locale)}"></span> - <span th:text="${#temporals.format(participant.camp.endDate.toLocalDate(), 'SHORT', #locale)}"></span>
		</a>
	</div>
</main>
