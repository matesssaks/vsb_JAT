<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{settings/_user}"
	th:with="page='role'"
>
<title layout:fragment="title" th:text="#{roles.title}"></title>
<main layout:fragment="content">
	<a class="w-75 btn icon-link bg-white text-success text-center p-4 rounded-3 d-flex justify-content-center shadow-sm"
	   th:href="@{/role/new}" data-modal>
		<i class="bi bi-plus-lg fs-2"></i>
	</a>
	<div th:each="role : ${roles}" th:object="${role}" class="w-75 bg-white p-4 rounded-3 fs-5 d-flex justify-content-between align-items-center shadow-sm">
		<span class="fw-semibold"><span th:text="*{name}"></span></span>
		<div class="d-flex gap-3">
			<a class="btn icon-link p-1 fs-2 text-primary" th:href="@{/role/edit/{id}(id=*{id})}" data-modal>
				<i class="bi bi-pen"></i>
			</a>
			<a class="btn icon-link p-1 fs-2 text-danger" th:href="@{/role/delete/{id}(id=*{id})}" data-modal>
				<i class="bi bi-trash"></i>
			</a>
		</div>
	</div>
</main>
