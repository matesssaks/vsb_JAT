<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{_base}"
>
<title layout:fragment="title" th:text="#{camp.title} + ' ' + ${camp.name}"></title>
<main layout:fragment="content" th:object="${camp}">
	<div class="w-75 row gx-3">
		<div class="col col-6">
			<div class="bg-white p-3 rounded-3">
				<div class="ratio ratio-1x1">
					<img th:src="*{imgUrl}" th:alt="*{name}" class="img-fluid w-100 h-100 object-fit-contain rounded-3">
				</div>
			</div>
		</div>
		<div class="col col-6">
			<div class="bg-white p-3 rounded-3 h-100 d-flex flex-column justify-content-between">
				<div class="d-flex flex-column gap-3">
					<span class="fs-2 fw-semibold" th:text="*{name}"></span>
					<span th:text="*{description}"></span>
				</div>
				<div class="bg-dark text-white p-4 rounded-3 fs-3 d-flex flex-container justify-content-between">
					<span><span th:text="*{price}"></span> Kč</span>
					<a class="btn btn-light text-black fs-5 py-1 px-5 icon-link" th:href="@{'/camp/register/' + *{id}}"
					   th:text="#{camp.register}">
					</a>
				</div>
			</div>
		</div>
	</div>
</main>
