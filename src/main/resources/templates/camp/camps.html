<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{_base}"
>
<title layout:fragment="title" th:text="#{camps.title}"></title>
<main layout:fragment="content">
	<div class="w-75 row g-3">
		<a th:each="camp : ${camps}" th:object="${camp}" th:href="@{'/camp/' + *{id}}" class="col col-4 text-decoration-none text-reset">
			<div class="bg-white d-flex flex-column p-3 rounded-3 align-items-center gap-3 h-100 shadow">
				<div class="ratio ratio-4x3">
					<img th:src="*{imgUrl}" th:alt="*{name}" class="img-fluid w-100 h-100 object-fit-cover rounded-3">
				</div>
				<span class="fs-5" th:text="*{name}"></span>
				<b class="fs-5"><span th:text="*{price}"></span> <th:block th:text="#{czk}"></th:block></b>
			</div>
		</a>
		<a sec:authorize="hasRole('ADMIN')" class="col col-4 text-decoration-none text-reset" th:href="@{'/camp/new'}" data-modal>
			<div class="bg-success-subtle text-success d-flex flex-column p-3 rounded-3 align-items-center justify-content-center gap-3 h-100 shadow">
				<i class="bi bi-plus-lg display-1"></i>
			</div>
		</a>
	</div>
</main>
</html>
