<!DOCTYPE html>
<html
	lang="en"
	th:lang="${#locale}"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title layout:fragment="title" th:text="#{_base.title}"></title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="container-fluid min-vh-100 d-flex flex-column g-0">
	<div class="flex-grow-1 d-flex flex-column">
		<header class="d-flex justify-content-between px-3 py-2 align-items-center sticky-top bg-white">
			<a th:href="@{/}"
			   class="fs-2 fw-semibold text-reset text-decoration-none"
			   layout:fragment="header"
			   th:text="#{_base.header}">
			</a>
			<div class="d-flex gap-3" layout:fragment="header_buttons">
				<div class="dropdown" sec:authorize="isAuthenticated()">
					<button class="btn icon-link p-1 fs-5" type="button" data-bs-toggle="dropdown" aria-expanded="false">
						<span th:text="${#authentication.name}"></span><i class="bi bi-person-fill fs-2"></i>
					</button>
					<ul class="dropdown-menu">
						<li><a class="dropdown-item" th:href="@{/person}" th:text="#{_user.menu.persons}"></a></li>
						<li><a class="dropdown-item" th:href="@{/participant}" th:text="#{_user.menu.registrations}"></a></li>
						<li><a class="dropdown-item" th:href="@{/role}" th:text="#{_user.menu.roles}"
							   sec:authorize="hasRole('ADMIN')"
						></a></li>
						<li><hr class="dropdown-divider"></li>
						<li>
							<form method="post" th:action="@{/logout}">
								<button type="submit" class="dropdown-item btn-outline-danger" th:text="#{logout}"></button>
							</form>
						</li>
					</ul>
				</div>
				<a class="btn btn-outline-primary" sec:authorize="isAnonymous()" th:href="@{/login}" th:text="#{login}"></a>
			</div>
		</header>
		<div class="flex-grow-1 d-flex">
			<div layout:fragment="side"></div>
			<main class="flex-grow-1 bg-primary-subtle p-4 d-flex flex-column gap-3 align-items-center"
				  layout:fragment="content">
			</main>
		</div>
	</div>
	<div id="modal" class="modal fade" tabindex="-1" aria-hidden="true"></div>

	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js" integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D" crossorigin="anonymous"></script>
	<script th:src="@{/js/modal.js}"></script>
</body>
</html>
